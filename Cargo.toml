[package]
name = "streambox"
version = "0.1.0"
edition = "2021"
description = "USB video capture and local recording service"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
hwcodec = { path = "../One-KVM/libs/hwcodec", features = ["bytes"] }
libyuv = { path = "../One-KVM/res/vcpkg/libyuv" }
v4l2r = { path = "../One-KVM/libs/v4l2r" }
nix = { version = "0.31", default-features = false, features = ["fs", "poll"] }
libc = "0.2"
mime_guess = "2"
rust-embed = "8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
